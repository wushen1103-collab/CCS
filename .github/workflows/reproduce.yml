name: Reproduce frozen results
on: [push, pull_request]
permissions:
  contents: read
jobs:
  numerical:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m pip install -r requirements-evaluation.txt
      - run: python -m pip install . --no-deps
      - run: python scripts/reproduce.py --bootstrap
      - run: python scripts/rebuild_fusion.py
      - run: python scripts/rebuild_fusion.py --refit-weights
